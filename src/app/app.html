<h1>Product Dashboard</h1>

<input
  type="text"
  placeholder="Search products..."
  (input)="updateSearch($event)"
/>

<div *ngIf="filteredProducts().length === 0">
  No products match your search
</div>

<div class="grid">
  <app-product-card
    *ngFor="let product of filteredProducts()"
    [product]="product">
  </app-product-card>
</div>
